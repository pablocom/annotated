[package]
name = "annotated-benchmarks"
description = "Benchmarks of annotated against the other Rust validation crates"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
annotated = { git = "https://github.com/pablocom/annotated", rev = "f881d35", features = ["regex", "unicode", "json"] }
garde = { version = "0.23.0", features = ["derive", "email", "url", "regex", "unicode"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
serde_valid = "3.2.0"
validator = { version = "0.21.0", features = ["derive"] }
wary = { version = "0.3.2", features = ["email", "url", "regex", "graphemes"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "validation"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
incremental = false

[profile.bench]
inherits = "release"

[profile.release-without-lto]
inherits = "release"
lto = false
codegen-units = 16

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
