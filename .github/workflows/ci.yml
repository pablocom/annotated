name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: stable
          - toolchain: "1.97"
            # Compiler output differs between versions, so the compile-fail tests pin stable's only.
            test-args: --skip compile_errors
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- ${{ matrix.test-args }}
      # The example turns on annotated's json feature, so leaving it out tests the crates with their default features.
      - run: cargo test --workspace --exclude annotated-example-axum -- ${{ matrix.test-args }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      - id: gungraun
        run: echo "version=$(cargo pkgid --manifest-path benchmarks/Cargo.toml gungraun | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@${{ steps.gungraun.outputs.version }}
      # A case that got slower is a warning, not a failure: whether the cost is worth it is for the change to say.
      - name: Compare with the commit before
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          status=0
          benchmarks/compare.sh "$BEFORE" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning title=Slower than ${BEFORE:0:7}::Some of annotated's cases run more than 1% more instructions, or allocate more, than at ${BEFORE:0:7}. This step's log lists them."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
