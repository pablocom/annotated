name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run on main, it publishes a release commit that an earlier run left unpublished.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: stable
          - toolchain: "1.98"
            # Compiler output differs between versions, so the compile-fail tests pin stable's only.
            test-args: --skip compile_errors
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features -- ${{ matrix.test-args }}
      # The examples turn on features of annotated, so leaving them out tests the crates with their default features.
      - run: cargo test --workspace --exclude annotated-example-axum --exclude annotated-example-utoipa -- ${{ matrix.test-args }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  release:
    if: github.ref == 'refs/heads/main'
    needs: [format, lint, test, docs]
    runs-on: ubuntu-latest
    environment: release
    # A release reads what the one before it left on main, so they run one at a time.
    concurrency: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits since the tag of the last release decide the next version.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Write the next releases
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut --fields=1)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on from this commit, so the run of its newest commit releases"
            exit
          fi
          releases="$RUNNER_TEMP/releases"
          cargo run --quiet --package annotated-release -- "$(date --utc +%F)" > "$releases"
          if [ ! -s "$releases" ]; then
            echo "::notice::No commit since the last releases changes the crates' code, so there is nothing to release"
            exit
          fi
          # A release that an earlier run wrote and left unpublished is named again, and writes nothing.
          if ! git diff --quiet; then
            tags=$(cut --delimiter=' ' --fields=1 "$releases")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "chore(repo): release ${tags//$'\n'/, }"
            git push origin HEAD:main
          fi
          echo "RELEASES=$releases" >> "$GITHUB_ENV"
      # Read before publishing, so a version without its changelog section never reaches crates.io.
      - name: Read the changelog section of each release
        if: env.RELEASES
        run: |
          while read -r tag changelog _ <&3; do
            version="${tag##*v}"
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { is_in_section = 1; next }
              is_in_section && (/^## \[/ || /^\[[^]]+\]: /) { exit }
              is_in_section { print }
            ' "$changelog" > "$RUNNER_TEMP/$tag.md"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/$tag.md"; then
              echo "::error::$changelog has no section for $version"
              exit 1
            fi
          done 3< "$RELEASES"
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.RELEASES
        id: auth
      - name: Publish the crates of each release
        if: env.RELEASES
        run: |
          packages=()
          while read -r _ _ crates <&3; do
            for crate in $crates; do
              packages+=(--package "$crate")
            done
          done 3< "$RELEASES"
          cargo publish "${packages[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create the GitHub release and tag of each release
        if: env.RELEASES
        run: |
          while read -r tag _ <&3; do
            # annotated's releases, tagged v1.2.3, are the repository's latest. A crate released on its own never is.
            is_annotated=false
            if [[ "$tag" == v* ]]; then
              is_annotated=true
            fi
            gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$tag" --notes-file "$RUNNER_TEMP/$tag.md" --latest="$is_annotated"
          done 3< "$RELEASES"
        env:
          GH_TOKEN: ${{ github.token }}
