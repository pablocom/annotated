[package]
name = "annotated-axum"
version = "0.1.0"
description = "An axum extractor that reads a JSON body with annotated, and answers every issue in it at once as RFC 9457 problem details"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["validation", "axum", "json", "problem-details", "annotated"]
categories = ["web-programming::http-server", "encoding"]

[dependencies]
annotated = { path = "../annotated", features = ["json"] }
axum = { version = "0.8.9", default-features = false, features = ["json"] }
mime = "0.3.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "macros"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
