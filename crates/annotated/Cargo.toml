[package]
name = "annotated"
description = "Annotate structs with validation rules and get every problem at once, missing fields included"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["validation", "validate", "serde", "derive", "annotations"]
categories = ["data-structures", "encoding", "rust-patterns"]

[features]
regex = ["dep:regex", "annotated-derive/regex"]
unicode = ["dep:unicode-segmentation"]

[dependencies]
annotated-derive = { version = "=0.1.0", path = "../annotated-derive" }
regex = { version = "1.13.1", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }

[dev-dependencies]
allocation-counter = "0.8.1"
iri-string = "0.7.14"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
trybuild = "1.0.122"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
