[package]
name = "annotated"
description = "Validation for structs that works with serde: every broken rule and missing field in one error"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["validation", "validate", "serde", "derive", "annotations"]
categories = ["data-structures", "encoding", "rust-patterns"]

[features]
default = ["serde"]
serde = ["dep:serde"]
regex = ["dep:regex", "annotated-derive/regex"]
unicode = ["dep:unicode-segmentation"]

[dependencies]
annotated-derive = { version = "=0.1.0", path = "../annotated-derive" }
regex = { version = "1.13.1", optional = true }
serde = { version = "1.0.229", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }

[dev-dependencies]
allocation-counter = "0.8.1"
iri-string = "0.7.14"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_test = "1.0.177"
trybuild = "1.0.122"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
